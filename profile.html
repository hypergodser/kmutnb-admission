<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลผู้สมัคร - มจพ.</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            background-color: #fcfcfc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- เฮดเดอร์ด้านบน --- */
        .header {
            background-color: #ffffff;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eeeeee;
        }
        .header h2 {
            font-size: 18px;
            font-weight: 600;
            color: #000000;
            margin: 0;
        }
        .user-nav {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
        }
        .user-nav span {
            color: #333333;
        }
        .btn-logout {
            color: #e64a19;
            text-decoration: underline;
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Kanit', sans-serif;
            font-size: 14px;
            padding: 0;
        }

        /* --- พื้นที่ส่วนกลาง --- */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* กล่องการ์ดโปรไฟล์ */
        .profile-card {
            background-color: #f5f5f5;
            border-radius: 24px;
            padding: 45px 55px;
            display: flex;
            align-items: flex-start;
            gap: 40px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        /* รูปไอคอนโปรไฟล์ทรงกลม */
        .avatar-circle {
            width: 110px;
            height: 110px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            flex-shrink: 0;
        }
        .avatar-circle svg {
            width: 65px;
            height: 65px;
            fill: #b5b5b5;
        }

        /* ข้อมูลรายละเอียดด้านขวา */
        .profile-details {
            flex: 1;
        }

        /* แถบแสดงและแก้ไขชื่อ */
        .name-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .name-label {
            font-size: 18px;
            font-weight: 600;
            color: #111111;
        }
        .btn-action {
            background-color: #e0e0e0;
            border: none;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 12.5px;
            cursor: pointer;
            font-family: 'Kanit', sans-serif;
            color: #333;
            transition: 0.2s;
        }
        .btn-action:hover {
            background-color: #d0d0d0;
        }

        /* ช่องแก้ไขชื่อ (ซ่อนไว้ตอนเริ่มต้น) */
        .edit-group {
            display: none;
            gap: 8px;
            width: 100%;
            margin-top: 5px;
        }
        .edit-input {
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: 'Kanit', sans-serif;
            font-size: 14px;
            flex: 1;
            outline: none;
        }
        .btn-save {
            background-color: #ff5722;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Kanit', sans-serif;
            font-size: 13px;
        }
        .btn-cancel {
            background-color: #888888;
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Kanit', sans-serif;
            font-size: 13px;
        }

        /* รายการหลักสูตร */
        .course-title {
            font-size: 14.5px;
            font-weight: 500;
            color: #333333;
            margin-bottom: 8px;
        }
        .course-bar {
            background-color: #d9d9d9;
            height: 24px;
            border-radius: 4px;
            width: 100%;
            max-width: 280px;
            margin-bottom: 24px;
        }

        /* ปุ่มกลับสู่หน้าแรก */
        .btn-home {
            display: inline-block;
            background-color: #3a3a3a;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 13.5px;
            font-weight: 400;
            transition: 0.2s;
        }
        .btn-home:hover {
            background-color: #222222;
        }

        /* --- ฟุตเตอร์สีส้ม --- */
        .footer {
            background-color: #ff5722;
            color: #ffffff;
            padding: 12px 20px;
            text-align: center;
            font-size: 12.5px;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <!-- เฮดเดอร์ -->
    <div class="header">
        <h2>การสมัครเข้าศึกษาต่อ ปีการศึกษา 2570</h2>
        <div class="user-nav">
            <span id="nav-username">นางสาว สมหญิง</span>
            <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
        </div>
    </div>

    <!-- ส่วนเนื้อหาหลัก -->
    <div class="main-container">
        <div class="profile-card">
            
            <!-- รูปโปรไฟล์ Avatar SVG -->
            <div class="avatar-circle">
                <svg viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>

            <!-- รายละเอียดผู้ใช้ -->
            <div class="profile-details">
                <!-- แถบแสดงชื่อและปุ่มแก้ไข -->
                <div class="name-row" id="display-name-group">
                    <span class="name-label" id="profile-name">ชื่อ นางสาว สมหญิง</span>
                    <button class="btn-action" onclick="toggleEdit(true)">แก้ไขชื่อ</button>
                </div>

                <!-- กล่องป้อนข้อมูลสำหรับแก้ไขชื่อ -->
                <div class="edit-group" id="edit-name-group">
                    <input type="text" id="name-input" class="edit-input" placeholder="กรอกชื่อ-นามสกุลใหม่">
                    <button class="btn-save" onclick="saveName()">บันทึก</button>
                    <button class="btn-cancel" onclick="toggleEdit(false)">ยกเลิก</button>
                </div>

                <div class="course-title">หลักสูตรที่สมัคร</div>
                <div class="course-bar"></div>

                <a href="index.html" class="btn-home">กลับสู่หน้าแรก</a>
            </div>

        </div>
    </div>

    <!-- ฟุตเตอร์ -->
    <div class="footer">
        ติดต่อเราได้ที่: กองบริการการศึกษา มจพ.
    </div>

    <!-- สคริปต์จัดการข้อมูล -->
    <script>
        // โหลดชื่อจาก localStorage เมื่อเปิดหน้า
        window.addEventListener("DOMContentLoaded", () => {
            const savedName = localStorage.getItem("username") || "นางสาว สมหญิง";
            updateNameDisplay(savedName);
        });

        // สลับมุมมองระหว่างแสดงชื่อ กับ กล่องแก้ไข
        function toggleEdit(isEditing) {
            const displayGroup = document.getElementById("display-name-group");
            const editGroup = document.getElementById("edit-name-group");
            const nameInput = document.getElementById("name-input");

            if (isEditing) {
                const currentName = localStorage.getItem("username") || "นางสาว สมหญิง";
                nameInput.value = currentName;
                displayGroup.style.display = "none";
                editGroup.style.display = "flex";
                nameInput.focus();
            } else {
                displayGroup.style.display = "flex";
                editGroup.style.display = "none";
            }
        }

        // บันทึกชื่อใหม่
        function saveName() {
            const nameInput = document.getElementById("name-input");
            const newName = nameInput.value.trim();

            if (newName !== "") {
                localStorage.setItem("username", newName);
                updateNameDisplay(newName);
                toggleEdit(false);
            } else {
                alert("กรุณากรอกชื่อ-นามสกุล");
            }
        }

        // อัปเดตข้อความชื่อในส่วนต่าง ๆ
        function updateNameDisplay(name) {
            document.getElementById("profile-name").textContent = `ชื่อ ${name}`;
            document.getElementById("nav-username").textContent = name;
        }

        // ออกจากระบบ
        function logout() {
            localStorage.removeItem("isLoggedIn");
            localStorage.removeItem("username");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
