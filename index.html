<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รับสมัครนักศึกษา มจพ.</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; font-family: 'Kanit', sans-serif; background-color: #555555; }
        .container { width: 100%; margin: 0 auto; background-color: #ffffff; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        img { width: 100%; display: block; height: auto; }
        
        .main-nav, .sub-nav { display: flex; border-bottom: 1px solid #ccc; }
        .main-nav { background-color: #e2e2e2; }
        .sub-nav { background-color: #dcdcdc; padding: 0; border-bottom: none; }
        .main-nav a, .sub-nav a { flex: 1; text-align: center; color: #555; text-decoration: none; font-weight: 500; font-size: 16px; transition: 0.2s; }
        .main-nav a { padding: 15px 0; border-right: 1px solid #ccc; }
        .main-nav a:last-child { border-right: none; }
        .sub-nav a { padding: 18px 0; color: #666; }
        .sub-nav a.active { background-color: #ffffff; color: #333; font-weight: 600; }
        .main-nav a:hover, .sub-nav a:hover { background-color: #d0d0d0; }
        .dropdown-icon { font-size: 10px; margin-left: 5px; vertical-align: middle; }
        
        .content-area { background-color: #363636; padding: 40px 60px; }
    </style>
</head>
<body>
    <div class="container">
        <img src="image/header_1.png" alt="Header KMUTNB">
        
        <nav class="main-nav">
            <a href="index.html">หน้าแรก</a>
            <a href="announcement.html">ประกาศรายชื่อ <span class="dropdown-icon">▼</span></a>
            <a href="scholarship.html">ทุนการศึกษา <span class="dropdown-icon">▼</span></a>
            <a href="print_doc.html">พิมพ์เอกสาร <span class="dropdown-icon">▼</span></a>
            <a href="contact.html">ติดต่อสอบถาม</a>
        </nav>
        
        <img src="image/header_2.png" alt="Banner 2570">
        
        <!-- แถบเมนูย่อย -->
        <nav class="sub-nav">
            <a href="index.html">ข่าวการรับสมัคร</a>
            <a href="courses.html">กรอกใบสมัคร</a>
            <a href="qualification.html">ตรวจสอบคุณวุฒิ</a>
            <a href="curriculum.html">หลักสูตรการศึกษา</a>
            <a href="schedule.html">กำหนดการรับนักศึกษาใหม่</a>
        </nav>
        
        <div class="content-area">
            <img src="image/content_index.png" alt="News Content Grid">
        </div>
        
        <img src="image/footer.png" alt="Footer Contact">
    </div>

    <script>
    if (localStorage.getItem("isLoggedIn") === "true") {
        let username = localStorage.getItem("username");
        let loginDiv = document.createElement("div");
        loginDiv.style.position = "absolute";
        loginDiv.style.top = "20px";
        loginDiv.style.right = "40px";
        loginDiv.innerHTML = `<span style="color:#fff; font-family:'Kanit'; margin-right:15px;">${username}</span> <button onclick="localStorage.removeItem('isLoggedIn'); window.location.reload();" style="cursor:pointer;">ออกจากระบบ</button>`;
        document.body.appendChild(loginDiv);
    } else {
        let loginDiv = document.createElement("div");
        loginDiv.style.position = "absolute";
        loginDiv.style.top = "20px";
        loginDiv.style.right = "40px";
        loginDiv.innerHTML = `<a href="login.html" style="color:#fff; font-family:'Kanit'; text-decoration:none; border:1px solid #fff; padding:5px 15px; border-radius:4px;">เข้าสู่ระบบ</a>`;
        document.body.appendChild(loginDiv);
    }
</script>
</body>
</html>
